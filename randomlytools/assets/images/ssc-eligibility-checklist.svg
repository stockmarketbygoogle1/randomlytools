<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f8fb"/><rect x="150" y="80" width="1300" height="740" rx="34" fill="#fff" stroke="#d8dee8" stroke-width="4"/><text x="230" y="165" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#182230">Before you submit an SSC form</text><text x="230" y="215" font-family="Arial,sans-serif" font-size="27" fill="#667085">Run through the basics, then verify them against the official notice.</text><g font-family="Arial,sans-serif" font-size="30" fill="#182230"><text x="250" y="310">✓ DOB and age cut-off date</text><text x="250" y="390">✓ Educational qualification</text><text x="250" y="470">✓ Post-specific qualification</text><text x="250" y="550">✓ Category / age relaxation</text><text x="250" y="630">✓ Physical or medical requirements, where applicable</text><text x="250" y="710">✓ Certificate and document requirements</text></g><text x="850" y="310" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#9a5a00">Do not rely on:</text><text x="850" y="365" font-family="Arial,sans-serif" font-size="25" fill="#566273">• old eligibility tables</text><text x="850" y="420" font-family="Arial,sans-serif" font-size="25" fill="#566273">• random social-media claims</text><text x="850" y="475" font-family="Arial,sans-serif" font-size="25" fill="#566273">• calculator result alone</text><text x="850" y="550" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#287342">Final check:</text><text x="850" y="605" font-family="Arial,sans-serif" font-size="25" fill="#566273">latest official SSC notification</text></svg>