<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f8fb"/><text x="120" y="130" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#182230">Start with your qualification</text><text x="120" y="185" font-family="Arial,sans-serif" font-size="28" fill="#667085">This is a starting point, not a substitute for the exam notification.</text><rect x="120" y="280" width="390" height="360" rx="28" fill="#fff" stroke="#d8dee8" stroke-width="4"/><text x="170" y="370" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#234a9f">10th pass</text><text x="170" y="435" font-family="Arial,sans-serif" font-size="28" fill="#4f5b6b">Check exams such as</text><text x="170" y="485" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#182230">MTS • GD</text><text x="170" y="550" font-family="Arial,sans-serif" font-size="24" fill="#687586">plus relevant Selection Posts</text><rect x="605" y="280" width="390" height="360" rx="28" fill="#fff" stroke="#d8dee8" stroke-width="4"/><text x="655" y="370" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#287342">12th pass</text><text x="655" y="435" font-family="Arial,sans-serif" font-size="28" fill="#4f5b6b">Check exams such as</text><text x="655" y="485" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#182230">CHSL • Stenographer</text><text x="655" y="550" font-family="Arial,sans-serif" font-size="24" fill="#687586">post-specific rules may apply</text><rect x="1090" y="280" width="390" height="360" rx="28" fill="#fff" stroke="#d8dee8" stroke-width="4"/><text x="1140" y="370" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#9a5a00">Graduate</text><text x="1140" y="435" font-family="Arial,sans-serif" font-size="28" fill="#4f5b6b">Check exams such as</text><text x="1140" y="485" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#182230">CGL • CPO</text><text x="1140" y="550" font-family="Arial,sans-serif" font-size="24" fill="#687586">plus post-specific qualifications</text><text x="120" y="745" font-family="Arial,sans-serif" font-size="25" fill="#566273">Always check the latest official SSC notice for the exact qualification and cut-off date.</text></svg>