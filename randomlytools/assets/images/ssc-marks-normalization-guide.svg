<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f8fb"/><text x="120" y="120" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#182230">Raw Marks vs Normalized Marks</text><rect x="120" y="220" width="580" height="360" rx="28" fill="#fff" stroke="#d8dee8" stroke-width="4"/><text x="175" y="315" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#234a9f">Raw score</text><text x="175" y="380" font-family="Arial,sans-serif" font-size="27" fill="#4f5b6b">Calculated from your answers</text><text x="175" y="430" font-family="Arial,sans-serif" font-size="27" fill="#4f5b6b">using the applicable marking scheme.</text><text x="175" y="500" font-family="Arial,sans-serif" font-size="24" fill="#687586">Correct − applicable negative marks</text><path d="M735 400h130" stroke="#9aa5b5" stroke-width="10" stroke-linecap="round"/><path d="M850 370l45 30-45 30" fill="none" stroke="#9aa5b5" stroke-width="10"/><rect x="900" y="220" width="580" height="360" rx="28" fill="#fff" stroke="#d8dee8" stroke-width="4"/><text x="955" y="315" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#287342">Normalized score</text><text x="955" y="380" font-family="Arial,sans-serif" font-size="27" fill="#4f5b6b">Where SSC applies normalization,</text><text x="955" y="430" font-family="Arial,sans-serif" font-size="27" fill="#4f5b6b">the notified methodology is used.</text><text x="955" y="500" font-family="Arial,sans-serif" font-size="24" fill="#687586">Do not assume raw = final normalized marks</text><text x="120" y="690" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#182230">Community discussions show why this causes confusion — use official SSC notices for the rule.</text><text x="120" y="740" font-family="Arial,sans-serif" font-size="23" fill="#687586">RandomlyTools calculators help with calculations; they do not reproduce every official normalization process.</text></svg>